name: Check routes

on:
  workflow_dispatch:        # Triggered externally by cron-job.org

concurrency:
  group: route-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    # Without this a hung run occupies the concurrency group for 6 hours and
    # every dispatch queued behind it gets cancelled.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check Bordeaux -> Lisbon directly (diagnostic)
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: node scripts/check-one-route.js 13 18

      - name: Run script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
        run: node index.js

      # Runs even when the script fails or the job is cancelled: the mail may
      # already have gone out, so a written history.json must never be dropped.
      - name: Commit history
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Update history [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "History pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push history.json — routes already emailed may be sent again."
          exit 1
