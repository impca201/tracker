name: Flights Debug

on:
  workflow_dispatch:
    inputs:
      fly_from:
        description: 'IATA vertrekhaven (bijv. BRU of CRL)'
        required: true
        default: 'BRU'
      fly_to:
        description: 'IATA bestemming (bijv. BCN of MAD)'
        required: true
        default: 'BCN'
      departure_date:
        description: 'Vertrekdatum (YYYY-MM-DD)'
        required: true
        default: '2026-05-01'
      show_all:
        description: 'Toon alle vluchten incl. gefilterde? (true/false)'
        required: false
        default: 'true'
      max_stopovers:
        description: 'Max stops naar MCP sturen (0 = alleen direct)'
        required: false
        default: '0'

jobs:
  debug-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run flights debug
        run: node flights-debug.js
        env:
          FLY_FROM:        ${{ inputs.fly_from }}
          FLY_TO:          ${{ inputs.fly_to }}
          DEPARTURE_DATE:  ${{ inputs.departure_date }}
          SHOW_ALL:        ${{ inputs.show_all }}
          MAX_STOPOVERS:   ${{ inputs.max_stopovers }}
